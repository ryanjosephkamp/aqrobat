<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Aqrobat</title
  ><link rel="stylesheet" href="popup.css" />
  <main>
    <h1>Aqrobat</h1>
    <p>Real characters. Local recipes.</p>
    <button id="open">Open generator / saved recipes</button
    ><label for="recipe">Saved recipe</label
    ><select id="recipe"></select>
    <p id="payload"></p>
    <button id="insert" disabled>Insert a saved QR into this page</button>
    <p id="status" role="status">
      Then click inside a multiline text box or rich editor, preview, and
      insert. Nothing is sent automatically.
    </p>
    <p>
      <a href="practice.html" target="_blank"
        >Open the insertion practice page</a
      >
    </p>
  </main>
  <script type="module" src="popup.mjs"></script>
</html>
